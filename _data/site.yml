research:
  label: "// research"
  title_main: "Research"
  title_accent: "& Security"
  items:
    - title: "Towards Efficient Text Anonymization Using Differential Privacy and Re-identification Risk-based Explainability"
      meta: "MSc Thesis &nbsp;·&nbsp; TU Berlin, Q&amp;U Lab &nbsp;·&nbsp; 2026"
      desc: "Privacy-preserving NLP using explainability methods and PII classification to reduce re-identification risk in text datasets while preserving utility. Trained transformer models on <a href=\"https://www.dfki.de/\" target=\"_blank\" rel=\"noopener\">DFKI</a> clusters and analyzed privacy-utility trade-offs."
      tags:
        - {label: "Differential Privacy", color: blue}
        - {label: "Text Anonymization", color: green}
        - {label: "Explainability", color: purple}
        - {label: "PyTorch", color: orange}
        - {label: "HuggingFace", color: blue}
    - title: "Text Anonymization Meets Explainability"
      meta: "Advanced Master's Project &nbsp;·&nbsp; TU Berlin &nbsp;·&nbsp; 2025"
      desc: "Earlier work on SLM-based text privacy with a medical dataset. Developed attacker models, privacy-utility benchmarks, and explored anonymization methods building on PETRE and FAISS-based entity matching with SHAP explainability."
      tags:
        - {label: "Medical NLP", color: green}
        - {label: "SHAP", color: blue}
        - {label: "Small Language Models", color: purple}
        - {label: "FAISS", color: orange}
    - title: "AlphaZero vs. MCTS: A Study on AI-based Game Strategy in Gomoku"
      meta: "BSc Thesis &nbsp;·&nbsp; TU Berlin &nbsp;·&nbsp; 2024"
      desc: "Compared AlphaZero variants and Monte Carlo Tree Search in Gomoku, with theory, implementation, and a playable AI-powered game."
      tags:
        - {label: "Reinforcement Learning", color: blue}
        - {label: "Monte Carlo Tree Search", color: green}
        - {label: "Game AI", color: purple}
      link: {label: "View on GitHub", url: "https://github.com/yamaceay/gomoku"}
  interests:
    label: "Research Interests"
    columns:
      - title: "Machine Learning"
        quote: "Not every model is correct, but some are useful."
        tags:
          - {label: "Small Language Models", color: blue}
          - {label: "Privacy-Preserving AI", color: green}
          - {label: "Neuroscience", color: purple}
          - {label: "Models of Higher Brain Functions", color: orange}
          - {label: "Optimization Algorithms", color: blue}
